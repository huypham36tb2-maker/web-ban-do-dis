<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg"></div>

    <div class="card">
        <div class="logo">🌙 LUNARA</div>
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to continue to lunara</p>

        <form id="login-form">
            <div class="field">
                <label>Email</label>
                <input type="email" placeholder="sol@lunara.app" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="options">
                <label class="checkbox-container">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" id="submit-btn">
                <span>Sign in</span>
            </button>
        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <div class="social-login">
            <button class="social-btn">Google</button>
            <button class="social-btn">Apple</button>
        </div>

        <div class="signup-link">
            New to Lunara? <a href="#">Create account</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
