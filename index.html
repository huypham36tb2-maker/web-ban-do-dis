<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel Sidebar</title>
    <!-- Font Awesome cho biểu tượng -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ================== VARIABLES & RESET ================== */
        :root {
            --bg-dark: #0f0f1a;        
            --bg-sidebar: #1a1a2e;     
            --glass-bg: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.1);
            --active-bg: #6c5ce7;      
            --text-primary: #ffffff;
            --text-muted: #a0a0b8;
            --transition: all 0.2s ease;
            --sidebar-width: 260px;
            --sidebar-collapsed: 80px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* ================== MAIN CONTAINER ================== */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* ================== SIDEBAR ================== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: width var(--transition), padding var(--transition);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: var(--sidebar-collapsed);
            padding: 20px 14px;
        }

        /* --- Header / Logo --- */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            white-space: nowrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .logo i {
            font-size: 1.5rem;
            color: var(--active-bg);
        }

        .logo-text {
            opacity: 1;
            transition: opacity var(--transition);
        }

        .sidebar.collapsed .logo-text {
            opacity: 0;
            pointer-events: none;
            width: 0;
        }

        .toggle-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- Navigation --- */
        .sidebar-nav {
            flex: 1;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            white-space: nowrap;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition);
            position: relative;
        }

        .nav-link i {
            font-size: 1.2rem;
            min-width: 20px;
            text-align: center;
        }

        .nav-text {
            opacity: 1;
            transition: opacity var(--transition), transform var(--transition);
        }

        .badge {
            background: var(--active-bg);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: auto;
            opacity: 1;
            transition: opacity var(--transition);
        }

        /* Hover state */
        .nav-link:hover {
            background: var(--glass-bg);
            color: var(--text-primary);
        }

        /* Active state */
        .nav-item.active .nav-link {
            background: var(--active-bg);
            color: var(--text-primary);
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.4);
        }

        /* Collapsed state (Sidebar thu nhỏ) */
        .sidebar.collapsed .nav-text,
        .sidebar.collapsed .badge {
            opacity: 0;
            width: 0;
            pointer-events: none;
        }

        .sidebar.collapsed .nav-link {
            justify-content: center;
        }

        /* --- User Profile --- */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            margin-top: auto;
            transition: var(--transition);
            white-space: nowrap;
        }

        .user-avatar img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--active-bg);
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            transition: opacity var(--transition), width var(--transition);
        }

        .user-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .user-actions i {
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .user-actions i:hover {
            color: var(--text-primary);
        }

        /* Collapsed state User Profile */
        .sidebar.collapsed .user-info,
        .sidebar.collapsed .user-actions {
            opacity: 0;
            width: 0;
            pointer-events: none;
        }

        .sidebar.collapsed .user-profile {
            justify-content: center;
            padding: 10px;
        }

        /* ================== MAIN CONTENT AREA ================== */
        .main-content {
            flex: 1;
            padding: 40px;
            background: var(--bg-dark);
            position: relative;
        }

        .content-wrapper h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .content-wrapper > p {
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .placeholder-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .placeholder-card i {
            font-size: 4rem;
            color: var(--active-bg);
            margin-bottom: 20px;
        }

        .placeholder-card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .placeholder-card p {
            color: var(--text-muted);
        }

        /* ================== RESPONSIVE ================== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 1000;
                height: 100%;
                left: -100%;
                transition: left 0.3s ease;
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo Header -->
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fa-solid fa-cube"></i>
                    <span class="logo-text">Admin Panel</span>
                </div>
                <button class="toggle-btn" id="toggleBtn">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

            <!-- Navigation Menu -->
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active" data-target="dashboard">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-chart-pie"></i>
                            <span class="nav-text">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item" data-target="users">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-users"></i>
                            <span class="nav-text">Users</span>
                        </a>
                    </li>
                    <li class="nav-item" data-target="orders">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span class="nav-text">Orders</span>
                        </a>
                    </li>
                    <li class="nav-item" data-target="analytics">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-chart-line"></i>
                            <span class="nav-text">Analytics</span>
                        </a>
                    </li>
                    <li class="nav-item" data-target="messages">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-envelope"></i>
                            <span class="nav-text">Messages</span>
                            <span class="badge">3</span>
                        </a>
                    </li>
                    <li class="nav-item" data-target="settings">
                        <a href="#" class="nav-link">
                            <i class="fa-solid fa-gear"></i>
                            <span class="nav-text">Settings</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- User Profile (Bottom) -->
            <div class="user-profile">
                <div class="user-avatar">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar">
                </div>
                <div class="user-info">
                    <span class="user-name">FEZ Academy</span>
                    <span class="user-role">Super Admin</span>
                </div>
                <div class="user-actions">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="content-wrapper">
                <h1>Dashboard Overview</h1>
                <p>Select an option from the sidebar to view its content.</p>
                <div class="placeholder-card">
                    <i class="fa-solid fa-rocket"></i>
                    <h3 id="contentTitle">Dashboard</h3>
                    <p>This is a placeholder for the "Dashboard" section.</p>
                </div>
            </div>
        </main>

    </div>

    <!-- ================== SCRIPT ================== -->
    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');
        const navItems = document.querySelectorAll('.nav-item');
        const contentTitle = document.getElementById('contentTitle');
        const placeholders = {
            dashboard: { title: 'Dashboard', icon: 'fa-chart-pie', desc: 'This is a placeholder for the "Dashboard" section.' },
            users: { title: 'Users', icon: 'fa-users', desc: 'This is a placeholder for the "Users" section.' },
            orders: { title: 'Orders', icon: 'fa-cart-shopping', desc: 'This is a placeholder for the "Orders" section.' },
            analytics: { title: 'Analytics', icon: 'fa-chart-line', desc: 'This is a placeholder for the "Analytics" section.' },
            messages: { title: 'Messages', icon: 'fa-envelope', desc: 'This is a placeholder for the "Messages" section.' },
            settings: { title: 'Settings', icon: 'fa-gear', desc: 'This is a placeholder for the "Settings" section.' }
        };

        // 1. Toggle Sidebar (Thu gọn / Mở rộng)
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        // 2. Click để chuyển đổi trạng thái Active
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();

                // Xóa active class khỏi tất cả các mục
                navItems.forEach(nav => nav.classList.remove('active'));

                // Thêm active class vào mục vừa click
                item.classList.add('active');

                // Cập nhật nội dung chính
                const target = item.getAttribute('data-target');
                const content = placeholders[target];
                
                contentTitle.textContent = content.title;
                const iconElement = document.querySelector('.placeholder-card i');
                iconElement.className = `fa-solid ${content.icon}`;
                document.querySelector('.placeholder-card p').textContent = content.desc;
            });
        });

        // 3. Responsive Mobile: Tự động đóng sidebar trên mobile khi click vào menu
        if (window.innerWidth <= 768) {
            sidebar.classList.add('mobile-open'); 
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.classList.remove('mobile-open');
            }
        });
    </script>
</body>
</html>
