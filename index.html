<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara - Sign in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.2);
            --input-focus: #ffffff;
            --accent: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            background: #07070b; 
        }

        /* Nền mặt trăng mờ ảo */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(100, 100, 150, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(80, 80, 120, 0.1) 0%, transparent 50%),
                url('https://images.unsplash.com/photo-1532693322450-2cb5c511067d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            filter: saturate(1.2) brightness(0.7); 
        }

        /* Khung Glassmorphism */
        .login-container {
            width: min(400px, 90vw);
            padding: 2.5rem 2rem;
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Fallback nếu trình duyệt không hỗ trợ kính mờ */
        @supports not (backdrop-filter: blur(1px)) {
            .login-container {
                background: rgba(15, 15, 25, 0.95);
            }
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .brand {
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.8;
            color: var(--text-secondary);
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 2.5rem 0.9rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            display: none;
        }

        .custom-check {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            position: relative;
            transition: all 0.2s ease;
        }

        .remember-me input[type="checkbox"]:checked + .custom-check {
            background: white;
            border-color: white;
        }

        .remember-me input[type="checkbox"]:checked + .custom-check::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: black;
            font-size: 12px;
            font-weight: 900;
        }

        .forgot-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: white;
        }

        .signin-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 1rem;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .social-btn {
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .footer-text {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .create-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .create-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                width: 90vw;
            }
            .title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <div class="login-container" id="loginContainer">
        <form class="login-form" id="loginForm">
            <div class="brand">🌙 LUNARA</div>
            <h1 class="title">Welcome back</h1>
            <p class="subtitle">Sign in to continue your journey</p>

            <div class="input-group">
                <input type="email" id="email" placeholder="Email address" required>
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </span>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <span class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span class="custom-check"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="signin-btn" id="signinBtn">
                <span class="btn-text">Sign in</span>
                <span class="btn-loader" hidden></span>
                <span class="btn-success" hidden>✓</span>
            </button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="social-btn google-btn">
                    <span class="social-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 4.5c1.5 0 2.8.5 3.8 1.5l2.8-2.8C17 1.5 14.7.5 12 .5 7.3.5 3.2 3.2 1.2 7.2l3.3 2.6C5.5 6.6 8.5 4.5 12 4.5z"/><path fill="#4285F4" d="M23.5 12.2c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.3 3.5l3.1 2.4c2.2-2 3.9-5 3.9-8.1z"/><path fill="#FBBC05" d="M4.5 14.2c-.4-1-.6-2-.6-3.2s.2-2.2.6-3.2l-3.3-2.6C.3 7.4 0 9.7 0 12s.4 4.6 1.2 6.8l3.3-2.6z"/><path fill="#34A853" d="M12 23.5c2.7 0 5-.9 6.8-2.4l-3.1-2.4c-.9.6-2 1-3.7 1-3.5 0-6.5-2.1-7.5-5.5l-3.3 2.6C3.2 20.8 7.3 23.5 12 23.5z"/></svg>
                    </span>
                    <span>Google</span>
                </button>
                <button type="button" class="social-btn apple-btn">
                    <span class="social-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.86-3.08.38-1.09-.5-2.08-.52-3.2 0-1.44.62-2.2.44-3.06-.38C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                    </span>
                    <span>Apple</span>
                </button>
            </div>

            <p class="footer-text">
                New to Lunara? <a href="#" class="create-link">Create account</a>
            </p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginContainer = document.getElementById('loginContainer');
            const loginForm = document.getElementById('loginForm');
            const signinBtn = document.getElementById('signinBtn');

            // Hiệu ứng nghiêng 3D theo chuột
            let maxTilt = 6;
            let tiltX = 0, tiltY = 0;
            let targetTiltX = 0, targetTiltY = 0;

            loginContainer.addEventListener('mousemove', (e) => {
                const rect = loginContainer.getBoundingClientRect();
                const mouseX = e.clientX - (rect.left + rect.width / 2);
                const mouseY = e.clientY - (rect.top + rect.height / 2);
                targetTiltX = -(mouseY / rect.height) * maxTilt;
                targetTiltY = (mouseX / rect.width) * maxTilt;
            });

            loginContainer.addEventListener('mouseleave', () => {
                targetTiltX = 0;
                targetTiltY = 0;
            });

            function animateTilt() {
                tiltX += (targetTiltX - tiltX) * 0.1;
                tiltY += (targetTiltY - tiltY) * 0.1;
                loginContainer.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
                requestAnimationFrame(animateTilt);
            }
            animateTilt();

            // Giả lập quá trình đăng nhập
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (signinBtn.classList.contains('loading') || signinBtn.classList.contains('success')) return;

                signinBtn.classList.add('loading');
                signinBtn.querySelector('.btn-text').textContent = 'Signing in...';

                setTimeout(() => {
                    signinBtn.classList.remove('loading');
                    signinBtn.classList.add('success');
                    signinBtn.querySelector('.btn-text').textContent = 'Signed in!';
                    signinBtn.querySelector('.btn-success').removeAttribute('hidden');
                    
                    // Thông báo thành công (demo)
                    setTimeout(() => {
                        alert('Đăng nhập thành công!');
                    }, 800);
                }, 2000);
            });
        });
    </script>
</body>
</html>
