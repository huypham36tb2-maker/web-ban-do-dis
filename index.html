<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara - Interactive Login</title>
    
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent: #00ffcf;
            --input-bg: rgba(0, 0, 0, 0.2);
            --font: 'Inter', sans-serif;
            --lamp-glow: rgba(255, 215, 130, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* ===== BACKGROUND EFFECTS ===== */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }

        .grid-bg {
            position: fixed; inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            mask-image: radial-gradient(circle, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 100%);
        }

        .blob-1, .blob-2, .blob-3 {
            position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; opacity: 0.6;
            animation: duz 10s infinite alternate ease-in-out;
        }
        .blob-1 { width: 400px; height: 400px; background: #00ffcf; top: -10%; left: -10%; }
        .blob-2 { width: 500px; height: 500px; background: #00b4d0; bottom: -10%; right: -10%; animation-duration: 12s; }
        .blob-3 { width: 300px; height: 300px; background: #f0c060; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 8s; }

        @keyframes duz {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.2); }
        }

        .noise {
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
        }

        /* ===== MAIN CARD ===== */
        .card {
            position: relative; z-index: 10;
            display: flex; width: min(900px, 90vw); height: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden; transition: all 0.5s ease;
        }

        /* ===== LEFT PANEL ===== */
        .leftPanel {
            flex: 1; position: relative;
            background: linear-gradient(135deg, #0a0a12, #12121e);
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding: 20px; overflow: hidden; border-right: 1px solid var(--card-border);
        }

        .cord-container {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            height: 250px; width: 50px; cursor: pointer; display: flex; justify-content: center;
        }

        .cord {
            width: 4px; height: 100%;
            background: linear-gradient(to bottom, #888, #fff);
            position: relative; z-index: 2; transform-origin: top center;
        }

        .lamp {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 80px; height: 60px; background: #333; border-radius: 50% 50% 0 0;
            z-index: 2; box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
        }

        .lamp-bulb {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            width: 40px; height: 40px; background: #555; border-radius: 50%;
            transition: all 0.5s ease; box-shadow: 0 0 0px var(--lamp-glow);
        }

        .lamp-glow {
            position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 100px; background: var(--lamp-glow); border-radius: 50%;
            filter: blur(30px); opacity: 0; transition: opacity 0.5s ease;
        }

        .card[data-light="on"] .lamp-bulb { background: #fff; box-shadow: 0 0 30px var(--lamp-glow), 0 0 80px var(--lamp-glow); }
        .card[data-light="on"] .lamp-glow { opacity: 1; }

        .light-cone {
            position: absolute; top: 250px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 100px solid transparent; border-right: 100px solid transparent;
            border-top: 300px solid rgba(255, 255, 220, 0.1);
            opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        .card[data-light="on"] .light-cone { opacity: 1; }

        .floor-glow {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 300px; height: 50px; background: radial-gradient(ellipse, rgba(255,255,200,0.3), transparent);
            border-radius: 50%; opacity: 0; transition: opacity 0.5s ease;
        }
        .card[data-light="on"] .floor-glow { opacity: 1; }

        .character {
            position: relative; z-index: 3; text-align: center; margin-bottom: 30px;
        }
        .face {
            width: 80px; height: 80px; background: rgba(255,255,255,0.05); border-radius: 50%;
            margin: 0 auto 10px; position: relative; border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.5s ease;
        }
        .eye { position: absolute; top: 30%; width: 10px; height: 10px; background: #fff; border-radius: 50%; transition: all 0.5s; }
        .eye-left { left: 25%; }
        .eye-right { right: 25%; }
        .mouth {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            width: 30px; height: 3px; background: #fff; border-radius: 5px; transition: all 0.5s;
        }
        .card[data-light="on"] .face { background: #2a2a3a; border-color: #ffeab0; box-shadow: 0 0 20px rgba(255,240,190,0.3); }
        .card[data-light="on"] .mouth { width: 20px; height: 15px; background: #ffeab0; border-radius: 0 0 20px 20px; }
        
        .character-text { font-size: 12px; color: var(--text-secondary); max-width: 150px; line-height: 1.4; }

        /* ===== RIGHT PANEL ===== */
        .rightPanel {
            flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center;
            transition: background 0.5s ease;
        }
        .card[data-light="off"] .rightPanel { background: rgba(0, 0, 0, 0.5); }

        .title { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: var(--text-secondary); font-size: 1rem; margin-bottom: 40px; }

        .login-form { display: flex; flex-direction: column; gap: 20px; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 1px; }
        .input-group input {
            width: 100%; padding: 15px; background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: var(--text-primary); font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 255, 207, 0.1); background: rgba(0, 0, 0, 0.4); }

        .btn-primary {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #006455, #008b65);
            color: var(--text-primary); font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 5px 20px rgba(0, 100, 85, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 100, 85, 0.5); }

        .divider { display: flex; align-items: center; margin: 30px 0; color: var(--text-secondary); font-size: 0.9rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .divider span { padding: 0 10px; }

        .social-buttons { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .social-btn {
            padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: var(--text-primary); font-size: 0.9rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .social-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .social-btn svg { width: 18px; height: 18px; }

        .footer-text { text-align: center; margin-top: 30px; font-size: 0.9rem; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .card { flex-direction: column; height: auto; width: 90vw; }
            .leftPanel { height: 200px; border-bottom: 1px solid var(--card-border); border-right: none; }
            .cord-container { height: 120px; }
            .light-cone { top: 120px; }
            .rightPanel { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="particles"></canvas>
    <div class="grid-bg"></div>
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="blob-3"></div>
    <div class="noise"></div>

    <!-- Main Card -->
    <div class="card" id="card" data-light="off">
        <div class="leftPanel">
            <div class="cord-container" id="cordContainer">
                <div class="cord"></div>
                <div class="lamp-glow"></div>
                <div class="lamp">
                    <div class="lamp-bulb"></div>
                </div>
            </div>

            <div class="character">
                <div class="face">
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="mouth"></div>
                </div>
                <p class="character-text" id="charText">Pull the cord to illuminate your path</p>
            </div>

            <div class="floor-glow"></div>
            <div class="light-cone"></div>
        </div>

        <div class="rightPanel">
            <h1 class="title">Welcome Back.</h1>
            <p class="subtitle">Please sign in to continue your path</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">SIGN IN &rarr;</button>
            </form>

            <div class="divider">or</div>

            <div class="social-buttons">
                <!-- Nút đăng nhập Google -->
                <button type="button" class="social-btn" id="googleBtn">
                    <svg viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 4.5c1.5 0 2.8.5 3.8 1.5l2.8-2.8C17 1.5 14.7.5 12 .5 7.3.5 3.2 3.2 1.2 7.2l3.3 2.6C5.5 6.6 8.5 4.5 12 4.5z"/>
                        <path fill="#4285F4" d="M23.5 12.2c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.3 3.5l3.1 2.4c2.2-2 3.9-5 3.9-8.1z"/>
                        <path fill="#FBBC05" d="M4.5 14.2c-.4-1-.6-2-.6-3.2s.2-2.2.6-3.2l-3.3-2.6C.3 7.4 0 9.7 0 12s.4 4.6 1.2 6.8l3.3-2.6z"/>
                        <path fill="#34A853" d="M12 23.5c2.7 0 5-.9 6.8-2.4l-3.1-2.4c-.9.6-2 1-3.7 1-3.5 0-6.5-2.1-7.5-5.5l-3.3 2.6C3.2 20.8 7.3 23.5 12 23.5z"/>
                    </svg>
                    <span>Login with Google</span>
                </button>
            </div>

            <p class="footer-text">Sign up if Google revalidated</p>
        </div>
    </div>

    <script>
        // ===== PARTICLE SYSTEM =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(100, window.innerWidth / 10);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        // ===== PULL CORD INTERACTIVITY =====
        const card = document.getElementById('card');
        const cordContainer = document.getElementById('cordContainer');
        const charText = document.getElementById('charText');
        let isLightOn = false;

        cordContainer.addEventListener('click', () => {
            isLightOn = !isLightOn;
            card.setAttribute('data-light', isLightOn ? 'on' : 'off');
            if (isLightOn) {
                charText.textContent = "Ah, you've found the light!";
            } else {
                charText.textContent = "Pull the cord to illuminate your path";
            }
        });

        // ===== FORM SUBMISSION =====
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('.btn-primary');
            btn.textContent = 'SIGNING IN...';
            setTimeout(() => {
                btn.textContent = 'SUCCESS ✓';
                setTimeout(() => {
                    btn.textContent = 'SIGN IN →';
                    alert('Login successful! (Demo)');
                }, 2000);
            }, 1500);
        });

        // ===== GOOGLE LOGIN (Dùng Client ID thật của bạn) =====
        document.getElementById('googleBtn').addEventListener('click', () => {
            google.accounts.id.initialize({
                client_id: '342884520101-eojb8qup68fvl87qrj5m6q3da3oufd8n.apps.googleusercontent.com',
                callback: handleGoogleCredential
            });

            // Hiển thị popup đăng nhập Google
            google.accounts.id.prompt((notification) => {
                // Nếu trình duyệt chặn popup, tự động click vào nút ẩn
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    const googleButton = document.createElement('div');
                    google.accounts.id.renderButton(googleButton, { type: 'icon', shape: 'pill', theme: 'outline', size: 'large' });
                    document.body.appendChild(googleButton);
                    googleButton.style.position = 'absolute';
                    googleButton.style.opacity = '0';
                    googleButton.style.pointerEvents = 'none';
                    
                    setTimeout(() => {
                        const clickableButton = googleButton.querySelector('div[role="button"]');
                        if (clickableButton) clickableButton.click();
                    }, 100);
                }
            });
        });

        function handleGoogleCredential(response) {
            // Giải mã token để lấy email và tên
            const userObject = JSON.parse(atob(response.credential.split('.')[1]));
            alert(`Đăng nhập Google thành công!\nChào mừng ${userObject.name}\nEmail: ${userObject.email}`);
        }
    </script>
</body>
</html>
