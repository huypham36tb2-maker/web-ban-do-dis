<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunara - Interactive Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent: #00ffcf;
            --input-bg: rgba(0, 0, 0, 0.2);
            --font: 'Inter', sans-serif;
            --lamp-on: rgba(255, 240, 190, 0.8);
            --lamp-glow: rgba(255, 215, 130, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
        }

        /* ================= BACKGROUND EFFECTS ================= */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            mask-image: radial-gradient(circle, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 100%);
        }

        .blob-1, .blob-2, .blob-3 {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.6;
            animation: duz 10s infinite alternate ease-in-out;
        }

        .blob-1 { width: 400px; height: 400px; background: #00ffcf; top: -10%; left: -10%; }
        .blob-2 { width: 500px; height: 500px; background: #00b4d0; bottom: -10%; right: -10%; animation-duration: 12s; }
        .blob-3 { width: 300px; height: 300px; background: #f0c060; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-duration: 8s; }

        @keyframes duz {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.2); }
        }

        .noise {
            position: fixed;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
            z-index: 1;
            pointer-events: none;
        }

        /* ================= MAIN CARD ================= */
        .card {
            position: relative;
            z-index: 10;
            display: flex;
            width: min(900px, 90vw);
            height: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* ================= LEFT PANEL ================= */
        .leftPanel {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #0a0a12, #12121e);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            border-right: 1px solid var(--card-border);
        }

        .cord-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 250px;
            width: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
        }

        .cord {
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #888, #fff);
            position: relative;
            z-index: 2;
            transform-origin: top center;
            transition: height 0.2s;
        }

        .lamp {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 60px;
            background: #333;
            border-radius: 50% 50% 0 0;
            z-index: 2;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.5);
        }

        .lamp-bulb {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: #555;
            border-radius: 50%;
            transition: all 0.5s ease;
            box-shadow: 0 0 0px var(--lamp-glow);
        }

        .lamp-glow {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: var(--lamp-glow);
            border-radius: 50%;
            filter: blur(30px);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Light effects ON state */
        .card[data-light="on"] .lamp-bulb {
            background: #fff;
            box-shadow: 0 0 30px var(--lamp-glow), 0 0 80px var(--lamp-glow);
        }

        .card[data-light="on"] .lamp-glow { opacity: 1; }

        .light-cone {
            position: absolute;
            top: 250px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-top: 300px solid rgba(255, 255, 220, 0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .card[data-light="on"] .light-cone { opacity: 1; }

        .floor-glow {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 50px;
            background: radial-gradient(ellipse, rgba(255,255,200,0.3), transparent);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .card[data-light="on"] .floor-glow { opacity: 1; }

        .character {
            position: relative;
            z-index: 3;
            text-align: center;
            margin-bottom: 30px;
        }

        .face {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            margin: 0 auto 10px;
            position: relative;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.5s ease;
        }

        .eye {
            position: absolute;
            top: 30%;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.5s;
        }

        .eye-left { left: 25%; }
        .eye-right { right: 25%; }

        .mouth {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #fff;
            border-radius: 5px;
            transition: all 0.5s;
        }

        /* Character ON state */
        .card[data-light="on"] .face {
            background: #2a2a3a;
            border-color: #ffeab0;
            box-shadow: 0 0 20px rgba(255,240,190,0.3);
        }

        .card[data-light="on"] .mouth {
            width: 20px;
            height: 15px;
            background: #ffeab0;
            border-radius: 0 0 20px 20px; /* smile */
        }

        .character-text {
            font-size: 12px;
            color: var(--text-secondary);
            max-width: 150px;
            line-height: 1.4;
        }

        /* ================= RIGHT PANEL ================= */
        .rightPanel {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(0, 255, 207, 0.1);
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #006455, #008b65);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 100, 85, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 100, 85, 0.5);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 10px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .social-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .footer-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        /* Dark overlay for form when light is off */
        .rightPanel {
            transition: background 0.5s ease;
        }

        .card[data-light="off"] .rightPanel {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                flex-direction: column;
                height: auto;
                width: 90vw;
            }
            .leftPanel {
                height: 200px;
                border-bottom: 1px solid var(--card-border);
                border-right: none;
            }
            .cord-container { height: 120px; }
            .light-cone { top: 120px; }
            .rightPanel { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <canvas id="particles"></canvas>
    <div class="grid-bg"></div>
    
    <div class="blob-1"></div>
    <div class="blob-2"></div>
    <div class="blob-3"></div>

    <div class="noise"></div>

    <!-- Main Card -->
    <div class="card" id="card" data-light="off">
        <div class="leftPanel" id="leftPanel">
            <div class="cord-container" id="cordContainer">
                <div class="cord" id="cord"></div>
                <div class="lamp-glow" id="lampGlow"></div>
                <div class="lamp" id="lamp">
                    <div class="lamp-bulb"></div>
                </div>
            </div>

            <div class="character" id="character">
                <div class="face">
                    <div class="eye eye-left"></div>
                    <div class="eye eye-right"></div>
                    <div class="mouth"></div>
                </div>
                <p class="character-text" id="charText">Pull the cord to illuminate your path</p>
            </div>

            <div class="floor-glow"></div>
            <div class="light-cone" id="lightCone"></div>
        </div>

        <div class="rightPanel">
            <h1 class="title">Welcome Back.</h1>
            <p class="subtitle">Please sign in to continue your path</p>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label>USERNAME</label>
                    <input type="text" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label>PASSWORD</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary">SIGN IN &rarr;</button>
            </form>

            <div class="divider">or</div>

            <div class="social-buttons">
                <button class="social-btn google">Google</button>
                <button class="social-btn github">GitHub</button>
            </div>

            <p class="footer-text">
                Sign up if Google revalidated
            </p>
        </div>
    </div>

    <!-- SVG Gradients -->
    <svg width="0" height="0">
        <defs>
            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#006455" />
                <stop offset="100%" stop-color="#008b65" />
            </linearGradient>
            <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#000035" />
                <stop offset="100%" stop-color="#00b4d0" />
            </linearGradient>
        </defs>
    </svg>

    <script>
        // ================= PARTICLE SYSTEM =================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.min(100, window.innerWidth / 10);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        // ================= INTERACTIVE CORD =================
        const card = document.getElementById('card');
        const cordContainer = document.getElementById('cordContainer');
        const cord = document.getElementById('cord');
        const charText = document.getElementById('charText');
        let isLightOn = false;

        cordContainer.addEventListener('click', () => {
            isLightOn = !isLightOn;
            card.setAttribute('data-light', isLightOn ? 'on' : 'off');
            
            // Change character text
            if (isLightOn) {
                charText.textContent = "Ah, you've found the light!";
                // Animate cord stretch
                cord.style.transform = 'scaleY(1.1)';
                setTimeout(() => cord.style.transform = 'scaleY(1)', 150);
            } else {
                charText.textContent = "Pull the cord to illuminate your path";
                cord.style.transform = 'scaleY(0.9)';
                setTimeout(() => cord.style.transform = 'scaleY(1)', 150);
            }
        });

        // ================= FORM SUBMISSION =================
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simulate login
            const btn = loginForm.querySelector('.btn-primary');
            btn.textContent = 'SIGNING IN...';
            btn.style.background = 'linear-gradient(90deg, #00b4d0, #00ffcf)';
            
            setTimeout(() => {
                btn.textContent = 'SUCCESS ✓';
                btn.style.background = 'linear-gradient(90deg, #008b65, #00ffcf)';
                
                setTimeout(() => {
                    btn.textContent = 'SIGN IN →';
                    btn.style.background = 'linear-gradient(90deg, #006455, #008b65)';
                    alert('Login successful! (Demo)');
                }, 2000);
            }, 1500);
        });
    </script>
</body>
</html>
